services:
  tracker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/sources.json:/app/sources.json:ro
      - tracker-data:/app/data
    ports:
      - "127.0.0.1:8799:8799"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,urllib.request; r=urllib.request.Request(\"http://127.0.0.1:8799/health\",headers={\"X-N8N-API-KEY\":os.environ[\"TOKEN_API_KEY\"]}); urllib.request.urlopen(r,timeout=5)'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  tracker-data:
